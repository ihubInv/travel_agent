version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: funny_mendel  # Correct indentation
    ports:
      - "5000:5000"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: practical_tesla  # Correct indentation
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
