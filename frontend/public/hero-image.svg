<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background with gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="600" height="400" fill="url(#skyGradient)" />
  
  <!-- Clouds -->
  <ellipse cx="150" cy="100" rx="80" ry="40" fill="url(#cloudGradient)" />
  <ellipse cx="200" cy="80" rx="60" ry="30" fill="url(#cloudGradient)" />
  <ellipse cx="450" cy="150" rx="70" ry="35" fill="url(#cloudGradient)" />
  <ellipse cx="500" cy="130" rx="50" ry="25" fill="url(#cloudGradient)" />
  <ellipse cx="300" cy="200" rx="90" ry="45" fill="url(#cloudGradient)" />
  <ellipse cx="350" cy="180" rx="70" ry="35" fill="url(#cloudGradient)" />
  
  <!-- Ground -->
  <path d="M0 300 L600 300 L600 400 L0 400 Z" fill="#E5E7EB" />
  
  <!-- AI Flight Agent Plane -->
  <g transform="translate(250, 150)">
    <!-- Main plane body -->
    <path d="M0 0 L100 0 L120 20 L100 40 L0 40 L20 20 Z" fill="url(#planeGradient)" />
    <!-- Wings -->
    <path d="M30 -30 L70 -30 L90 -10 L70 10 L30 10 L10 -10 Z" fill="url(#planeGradient)" />
    <path d="M30 30 L70 30 L90 50 L70 70 L30 70 L10 50 Z" fill="url(#planeGradient)" />
    <!-- Windows -->
    <circle cx="30" cy="20" r="5" fill="white" fill-opacity="0.8" />
    <circle cx="50" cy="20" r="5" fill="white" fill-opacity="0.8" />
    <circle cx="70" cy="20" r="5" fill="white" fill-opacity="0.8" />
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="350" r="20" fill="#3B82F6" fill-opacity="0.2" />
  <circle cx="550" cy="350" r="15" fill="#8B5CF6" fill-opacity="0.2" />
  <path d="M100 320 L150 340" stroke="#3B82F6" stroke-width="3" stroke-opacity="0.3" />
  <path d="M450 340 L500 320" stroke="#8B5CF6" stroke-width="3" stroke-opacity="0.3" />
</svg> 